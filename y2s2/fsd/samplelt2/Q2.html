<body>
    Living cost survey<br><br>
    <!-- Add your form here -->
     <form>
        <span>City:</span>
        <input type="radio" id="city-la" name="City" value="LA">

        <input type="radio" id="city-ok" name="City" value="OK">
        <label for="city-ok">Oklahoma</label>
        <br>
        <label for="CoM">Cost Of Meal:</label>
        <input type="number" id="CoM" placeholder="e.g $250">
        <br>
        <label for="CoU">Cost Of Utility:</label>
        <input type="number" id="CoU" placeholder="e.g $300">
        <br>
        <label for= "RR">Room Rental:</label><select id="RR" name="RR">
            <option value="1-Room">1 room</option>
            <option value="3-Room">3 room</option>
        </select>
        <label for="CRR">cost:</label>
        <input type="number" id="CRR" placeholder="e.g $500">

        <label for="Salary">Your Salary</label>
        <input type="number" id="Salary" placeholder="e.g $3000">
        <br>
        <label for="Email">Your Email:</label>
        <input type="text" id="Email" placeholder="johnma@gmail.com" required><br>
        <input type="submit">
     </form>
