            #tower, .map{
                visibility: hidden;
            }
            .mouseOverMe:hover #tower{
                visibility:visible
            }
            .mouseOverMe:hover .map{
                visibility: visible;
            }

        </style>
    </head>
    <body>
        <div class="mouseOverMe" style="font-size: 50px">
            &#128508;
            <div id="tower">Tokyo Tower</div>
        </div>
        <div class="mouseOverMe" style="font-size: 50px">
            Where?

        </div>
    </body>
