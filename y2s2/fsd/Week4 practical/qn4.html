<head>
    <meta charset="UTF-8">
    <title>Drag and Drop</title>
    <style>
        .dropBox {
            border: 1px solid;
            height: 15ch;
            width: 150px;
        }
        p{
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>What are the languages we use in Full Stack Development?</h1>
<ol class="dropBox" ondrop="handleDrop(event)"
     ondragover="handleDragOver(event)">
</ol><br><br>
    <h1>Drag and drop into the box</h1><br>
    <p id="dragText" draggable="true" 
       ondragstart="handleStartDrag(event)">C++</p>
    
    <p id="dragText1" draggable="true"
        ondragstart="handleStartDrag(event)">Java</p>
    
    <p id="dragText2" draggable="true" 
       ondragstart="handleStartDrag(event)">JavaScript</p>
    
    <p id="dragText3" draggable="true"
        ondragstart="handleStartDrag(event)">HTML</p>

    <p id="dragText4" draggable="true"
        ondragstart="handleStartDrag(event)">CSS</p>
    
    <script>
        function handleDrop(e){
           const data = e.dataTransfer.getData("text");
           const element = document.getElementById(data);
           let text = element.innerText;
        let li = document.createElement('li');
            li.innerText = text;
        e.target.closest("ol").appendChild(li);
        element.remove();
        }

        function handleDragOver(e){
            e.preventDefault();
        }

        function handleStartDrag(e){
              e.dataTransfer.setData("text",e.target.id);
        }
    </script>
</body>
