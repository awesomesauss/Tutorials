<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,body{
            height:100%;
        }
        
        .bg {
            position: absolute ;
            width: 100%;
            height: 100%;
            opacity: 0.3;
            background-image : url("https://picsum.photos/id/684/600/400");
            background-size : cover;
        } 

        .content{
            position:absolute;
            left:50%;
            top:50%;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="content">
        <h1>Hello World</h1>
    </div>
</body>
</html>
