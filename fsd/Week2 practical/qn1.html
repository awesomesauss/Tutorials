<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .heading{
            font-family: 'Arial Narrow';
            font-size: 3em;
        }

        .content::first-letter{
            color:blue;
            background-color:yellow;
            font-family: monospace;
            font-weight: bold;
            font-size: 1.5em;
        }

        .name{
            background-color: gray;
            font-family: serif;
            font-style: bolder;
            font-size: 1.5em
        }
    </style>
</head>
<body>
    <p class="heading">Quotes</p>
    <p class="content">There is nothing like a dream to create the future
        <span class="name">-- Victor Hugo</span>
    </p>
    <br>
    <p>(without CSS)</p>
    <br>
    <h1>Quotes</h1>
    <p>There is nothing like a dream to create a future -- Victor Hugo</p>
</body>
</html>
